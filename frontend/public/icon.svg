<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)"/>

  <!-- Shield Shape Outer Glow -->
  <path d="M256 64 L416 128 C416 288 344 396 256 448 C168 396 96 288 96 128 Z"
        fill="none" stroke="#00f2fe" stroke-width="8" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Shield Shape Primary -->
  <path d="M256 72 L404 132 C404 280 336 382 256 432 C176 382 108 280 108 132 Z"
        fill="#0b1329" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Inner Cryptographic Vault Lock -->
  <!-- Shackle -->
  <path d="M208 230 V194 C208 167 229 146 256 146 C283 146 304 167 304 194 V230"
        fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="180" y="224" width="152" height="120" rx="24" fill="#060c1c" stroke="url(#cyanGrad)" stroke-width="7"/>

  <!-- Keyhole Core -->
  <circle cx="256" cy="272" r="14" fill="#00f2fe"/>
  <path d="M250 278 L246 312 H266 L262 278 Z" fill="#00f2fe"/>

  <!-- Circuit nodes -->
  <circle cx="164" cy="180" r="5" fill="#00f2fe" opacity="0.8"/>
  <path d="M164 180 L136 210" stroke="#00f2fe" stroke-width="2" opacity="0.5"/>
  <circle cx="348" cy="180" r="5" fill="#4facfe" opacity="0.8"/>
  <path d="M348 180 L376 210" stroke="#4facfe" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="384" r="6" fill="#6366f1"/>
</svg>
