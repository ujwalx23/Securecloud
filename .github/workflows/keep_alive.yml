name: Keep Render Backend Awake 24/7

on:
  schedule:
    # Runs every 10 minutes 24/7/365 to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging SecureCloud Render API..."
          curl -s -f -m 60 https://securecloud-i0qq.onrender.com/health || echo "Wakeup ping triggered"
